name: Aggiornamento Prezzi Carburanti

on:
  schedule:
    # 07:00 UTC = 09:00 CEST / 08:00 CET
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'etl/**'
      - 'requirements.txt'
      - 'site/*.html'
      - 'site/*.js'
      - 'site/*.css'
      - '.github/workflows/daily_update.yml'

permissions:
  contents: write

concurrency:
  group: carburanti-data-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        run: python etl/fetch_and_process.py

      - name: Build station history
        run: python etl/build_station_history.py

      - name: Validate generated data
        run: python etl/validate_generated_data.py

      - name: Smoke test site
        run: python etl/smoke_test_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/

          if git diff --staged --quiet; then
            echo "No data changes to publish"
            exit 0
          fi

          git commit -m "Aggiornamento prezzi $(date +%Y-%m-%d)"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Unable to publish data after 3 attempts"
          exit 1
