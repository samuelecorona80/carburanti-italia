name: Aggiornamento Prezzi Carburanti

on:
  schedule:
    # Ogni giorno alle 7:00 UTC (= 9:00 ora italiana, dopo pubblicazione MIMIT alle 8)
    - cron: '0 7 * * *'
  workflow_dispatch: # Trigger manuale

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        run: python etl/fetch_and_process.py

      - name: Copy data to site
        run: |
          mkdir -p site/data
          cp data/latest.json site/data/
          cp data/history.json site/data/
          cp data/last_update.json site/data/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/
          git diff --staged --quiet || git commit -m "📊 Aggiornamento prezzi $(date +%Y-%m-%d)"
          git push
